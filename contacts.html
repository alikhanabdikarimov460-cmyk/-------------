<div class="container py-5">
    <h1 class="text-center mb-4">Биз менен байланышыңыз</h1>

    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow p-4">
                <form id="contactForm">
                    <label class="form-label">Атыңыз</label>
                    <input type="text" class="form-control mb-3" placeholder="Атыңызды жазыңыз" required>

                    <label class="form-label">Телефон номериңиз</label>
                    <input type="tel" class="form-control mb-3" placeholder="+996 700 123 456" required>

                    <label class="form-label">Электрондук почта</label>
                    <input type="email" class="form-control mb-3" placeholder="example@gmail.com">

                    <label class="form-label">Билдирүү</label>
                    <textarea class="form-control mb-3" rows="4" placeholder="Сурооңузду жазыңыз" required></textarea>

                    <button type="submit" class="btn btn-primary w-100">
                        Билдирүү жөнөтүү
                    </button>
                </form>

                <div id="message" class="alert alert-success mt-3 d-none">
                    Сиздин билдирүүңүз кабыл алынды!
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-5">
        <h4>Биздин дарек</h4>
        <p>📍 Бишкек шаары, Кыргызстан</p>
