
<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ипотека | RealEstate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">🏠 RealEstate</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Башкы бет</a></li>
                <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
                <li class="nav-item"><a class="nav-link" href="rent-sale.html">Сатуу/Ижара</a></li>
                <li class="nav-item"><a class="nav-link active" href="mortgage.html">Ипотека</a></li>
                <li class="nav-item"><a class="nav-link" href="contacts.html">Байланыш</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow p-4">
                <h2 class="text-center mb-4">Ипотека калькулятору</h2>

                <label class="form-label">Үйдүн баасы (сом)</label>
                <input type="number" id="price" class="form-control mb-3" placeholder="Мисалы: 5000000">

                <label class="form-label">Баштапкы төлөм (сом)</label>
                <input type="number" id="initial" class="form-control mb-3" placeholder="Мисалы: 1000000">

                <label class="form-label">Жылдык пайыз (%)</label>
                <input type="number" id="rate" class="form-control mb-3" value="10">

                <label class="form-label">Мөөнөт (жыл)</label>
                <select id="years" class="form-select mb-3">
                    <option value="5">5 жыл</option>
                    <option value="10">10 жыл</option>
                    <option value="15">15 жыл</option>
                    <option value="20">20 жыл</option>
                </select>

                <button class="btn btn-primary w-100" onclick="calculateMortgage()">
                    Эсептөө
                </button>

                <div id="result" class="alert alert-success mt-4 d-none"></div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center p-4">
    © 2026 RealEstate
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
